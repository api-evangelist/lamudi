aid: lamudi
name: Lamudi
description: 'Lamudi is an online real estate classifieds marketplace focused exclusively on emerging
  markets, founded in 2013 and today operating consumer property portals in the Philippines
  (lamudi.com.ph), Indonesia (lamudi.co.id) and Mexico (lamudi.com.mx). The platform lets buyers,
  renters, sellers and landlords search and list houses, condominiums/apartments, land, commercial
  space and offices, filtered by geography, property group and operation (buy/rent). Search results
  pages carry area market statistics, interactive maps and nearby points of interest, alongside
  country-specific features such as Philippine foreclosures and home-loan comparison, Indonesian KPR
  mortgage simulators, and Mexican Infonavit-eligible listings and bank repossessions. Agencies and
  developers publish inventory through the pro.lamudi.com professional portal. Lamudi operates as
  part of LIFULL Connect, which supplies its legal notice, privacy policy and contact surface. Lamudi
  publishes no public developer API, SDK or developer portal; its notable machine-readable surface is
  a first-party llms.txt on each country site that documents the URL grammar of its search, new
  development and project pages for AI agents.'
